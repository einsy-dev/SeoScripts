{{ define "table" }}
<div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider">
          <th class="py-3 px-4">Domain</th>
          <th class="py-3 px-4">Type</th>
          <th class="py-3 px-4">Comment</th>
        </tr>
      </thead>
      <!-- HTMX will swap the updated table rows directly into this container -->
      <tbody id="table-results" class="divide-y divide-slate-100 text-sm text-slate-700">
        <!-- Initial row rendering fallback / default state -->

        {{ range . }}
        <!-- The dot now points directly to the current User struct element -->
        <tr>
          <td class="py-3 px-4 font-medium text-slate-900">{{ .Domain }}</td>
          <td class="py-3 px-4 text-slate-500">{{ .Type }}</td>
          <td class="py-3 px-4">
            <span
              class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200"
              >{{ .Comment }}</span
            >
          </td>
        </tr>
        {{ end }}
      </tbody>
    </table>
  </div>
</div>
{{end}}
